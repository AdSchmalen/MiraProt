name: Bug report
description: Report a reproducible problem with MiraProt
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem.

        Please do not upload unpublished, confidential, patient-identifying, personally identifying, proprietary, or otherwise sensitive data. Use synthetic or properly anonymized examples whenever possible.

  - type: input
    id: version
    attributes:
      label: MiraProt version
      description: For example, v1.0.0 or the commit identifier if you are using an unreleased source version.
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation mode
      options:
        - Source installation
        - Windows portable build
        - Linux portable build
        - macOS portable build
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "For example: Windows 11, Ubuntu 24.04, macOS"
    validations:
      required: true

  - type: input
    id: r_version
    attributes:
      label: R version
      description: If relevant, provide the output of R.version.string.
      placeholder: "For example: R version 4.x.x"

  - type: input
    id: module
    attributes:
      label: Affected module or workflow step
      placeholder: "For example: Data Wizard, PCA, GSEA, Heatmap, STRING"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence of steps that reliably produces the problem.
      placeholder: |
        1. Start MiraProt...
        2. Import...
        3. Select...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened instead? Include relevant error messages.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or additional information
      description: Paste relevant non-sensitive logs, screenshots, or other details if useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing Issues for the same problem.
          required: true
        - label: I checked the README and relevant documentation.
          required: true
        - label: I have not included confidential, identifying, proprietary, or otherwise sensitive data.
          required: true
